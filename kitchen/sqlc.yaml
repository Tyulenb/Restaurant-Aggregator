version: "2"

sql:
  - engine: "postgresql"
    queries: "internal/establishment/adapter/postgres/establishment/queries.sql"
    schema: "migrations/schemes"
    gen:
      go:
        package: ""
        out: "internal/establishment/adapter/postgres/establishment/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
